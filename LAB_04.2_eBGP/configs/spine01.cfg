! Command: show running-config
! device: SPINE1 (cEOSLab, EOS-4.34.2F-43232954.4342F (engineering build))
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$WoWYkk2pQOVDHJX8$R9CJ/MgPlIoSHFufBOwNYZT7dODuHRDC9MdhGUfWYoUiP.9a1xTPTY4uqBq5RxYy1O5wTTHces94djIHhM4qI/
!
management api http-commands
   no shutdown
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname SPINE1
dns domain lab.local
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   description P2P-LEAF1
   mtu 9214
   no switchport
   ip address 10.1.2.0/31
   bfd interval 100 min_rx 100 multiplier 3
!
interface Ethernet2
   description P2P-LEAF2
   mtu 9214
   no switchport
   ip address 10.1.2.2/31
   bfd interval 100 min_rx 100 multiplier 3
!
interface Ethernet3
   description P2P-LEAF3
   mtu 9214
   no switchport
   ip address 10.1.2.4/31
   bfd interval 100 min_rx 100 multiplier 3
!
interface Loopback0
   description ROUTER-ID
   ip address 10.1.0.1/32
!
interface Management0
   ip address 172.20.20.8/24
   ipv6 address 3fff:172:20:20::8/64
!
ip routing
!
ip route 0.0.0.0/0 172.20.20.1
!
ipv6 route ::/0 3fff:172:20:20::1
!
route-map RM_REDISTRIBUTE-Lo0 permit 10
   match interface Loopback0
   set community 65000:1
   set origin igp
!
peer-filter LEAFS-AS-FILTER
   10 match as-range 65001-65003 result accept
!
router bgp 65000
   router-id 10.1.0.1
   maximum-paths 4
   bgp listen range 10.1.2.0/23 peer-group LEAFS peer-filter LEAFS-AS-FILTER
   neighbor LEAFS peer group
   neighbor LEAFS bfd
   neighbor LEAFS timers 3 9
   neighbor LEAFS send-community standard extended
   !
   address-family ipv4
      neighbor LEAFS activate
      redistribute connected route-map RM_REDISTRIBUTE-Lo0
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
