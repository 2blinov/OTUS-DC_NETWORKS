! device: BGW2 (cEOSLab, EOS-4.34.2F-43232954.4342F (engineering build))
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$KjSyPDmm8473PBGw$U0DFhAzN0eBmy0..HktT1TiIlGQTkAzGVzfKRODjqnE6ewZrqs/pbxlpGlNh.ixXzY7CxpNXX9IpZE0v.x6yD.
!
management api http-commands
   no shutdown
!
alias sibs show ip bgp summary
alias srb show running-config section bgp
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname BGW2
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 10
   name VLAN10
!
vlan 20
   name VLAN20
!
vrf instance MGMT
!
vrf instance TENANT1
!
vrf instance TENANT2
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   description P2P-SPINE21
   mtu 9214
   no switchport
   ip address 10.2.2.0/31
!
interface Ethernet2
   description P2P-SPINE22
   mtu 9214
   no switchport
   ip address 10.2.2.2/31
!
interface Ethernet3
   description P2P-BGW1
   mtu 9214
   no switchport
   ip address 10.0.0.3/31
!
interface Loopback0
   description ROUTER-ID
   ip address 10.2.0.0/32
!
interface Loopback1
   description VIP-DCI
   ip address 10.0.0.1/32
!
interface Management0
   vrf MGMT
   ip address 172.20.20.6/24
   ipv6 address 3fff:172:20:20::6/64
!
interface Vlan10
   vrf TENANT1
   ip address 10.10.10.252/24
!
interface Vlan20
   vrf TENANT2
   ip address 10.10.20.252/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address 00:00:00:00:02:02
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 20 vni 10020
   vxlan vrf TENANT1 vni 50001
   vxlan vrf TENANT2 vni 50002
   vxlan learn-restrict any
!
ip routing
ip routing vrf MGMT
ip routing vrf TENANT1
ip routing vrf TENANT2
!
ip route vrf MGMT 0.0.0.0/0 172.20.20.1
!
route-map PERMIT_DEFAULT permit 10
!
router bgp 65002
   router-id 10.2.0.0
   no bgp default ipv4-unicast
   timers bgp 1 3
   distance bgp 20 200 200
   maximum-paths 4 ecmp 4
   neighbor DCI peer group
   neighbor DCI remote-as 65001
   neighbor DCI send-community extended
   neighbor SPINE-EVPN peer group
   neighbor SPINE-EVPN remote-as 65002
   neighbor SPINE-EVPN update-source Loopback0
   neighbor SPINE-EVPN send-community extended
   neighbor UNDERLAY peer group
   neighbor UNDERLAY remote-as 65002
   neighbor def peer group
   neighbor 10.0.0.2 peer group DCI
   neighbor 10.2.0.1 peer group SPINE-EVPN
   neighbor 10.2.0.2 peer group SPINE-EVPN
   neighbor 10.2.2.1 peer group UNDERLAY
   neighbor 10.2.2.3 peer group UNDERLAY
   !
   vlan 10
      rd evpn domain all 10.2.0.0:10
      route-target both 10:10010
      route-target import export evpn domain remote 10:10
      redistribute learned
   !
   vlan 20
      rd evpn domain all 10.2.0.0:20
      route-target both 20:10020
      route-target import export evpn domain remote 20:20
      redistribute learned
   !
   address-family evpn
      neighbor DCI activate
      neighbor DCI domain remote
      neighbor SPINE-EVPN activate
      domain identifier 2:2
      domain identifier 1:1 remote
      neighbor default next-hop-self received-evpn-routes route-type ip-prefix inter-domain
   !
   address-family ipv4
      neighbor DCI activate
      neighbor UNDERLAY activate
      network 10.0.0.1/32
      network 10.0.0.2/31
      network 10.2.0.0/32
      network 10.2.2.0/31
      network 10.2.2.2/31
   !
   vrf TENANT1
      rd 65002:101
      rd evpn domain remote 65001:101
      route-target import evpn 1:50001
      route-target export evpn 1:50001
   !
   vrf TENANT2
      rd 65002:102
      rd evpn domain remote 65001:102
      route-target import evpn 1:50002
      route-target export evpn 1:50002
      redistribute connected
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end
