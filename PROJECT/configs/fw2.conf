frr version 10.7.1
frr defaults traditional
hostname fw2
domainname localdomain
log syslog informational
service integrated-vtysh-config
!
ip prefix-list PL-IN-TENANT1 seq 10 permit 10.10.10.0/24 le 32
ip prefix-list PL-IN-TENANT2 seq 10 permit 10.10.20.0/24 le 32
!
route-map RM-IN-TENANT1 permit 10
 match ip address prefix-list PL-IN-TENANT1
exit
!
route-map RM-IN-TENANT2 permit 10
 match ip address prefix-list PL-IN-TENANT2
exit
!
vrf FW
exit-vrf
!
interface lo
 ip address 10.0.1.2/32
exit
!
router bgp 65102 vrf FW
 bgp router-id 10.0.1.2
 no bgp ebgp-requires-policy
 neighbor 10.0.2.3 remote-as 65100
 neighbor 10.0.2.3 bfd
 neighbor 10.0.2.3 bfd profile P-BFD
 neighbor 10.2.2.12 remote-as 65002
 neighbor 10.2.2.12 bfd
 neighbor 10.2.2.12 bfd profile P-BFD
 neighbor 10.2.2.14 remote-as 65002
 neighbor 10.2.2.14 bfd
 neighbor 10.2.2.14 bfd profile P-BFD
 !
 address-family ipv4 unicast
  network 10.0.1.2/32
  network 10.0.2.2/31
  network 10.2.2.12/31
  network 10.2.2.14/31
  neighbor 10.2.2.12 soft-reconfiguration inbound
  neighbor 10.2.2.12 route-map RM-IN-TENANT1 in
  neighbor 10.2.2.14 soft-reconfiguration inbound
  neighbor 10.2.2.14 route-map RM-IN-TENANT2 in
 exit-address-family
exit
!
bfd
 profile P-BFD
 exit
 !
exit
!
end
