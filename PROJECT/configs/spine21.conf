! device: SPINE21 (cEOSLab, EOS-4.34.2F-43232954.4342F (engineering build))
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$c9aL4o5KffjQbd1H$oizICbvGv3gLmTZWt3OCR86BWC.C9riRgbd9by60vbmodjYJmypof9GHy0mu82yYanIHh2CrV7Z/gNDetEDi5.
!
management api http-commands
   no shutdown
!
alias sibs show ip bgp summary
alias srb show running-config section bgp
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname SPINE21
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vrf instance MGMT
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   description P2P-LEAF21
   mtu 9214
   no switchport
   ip address 10.2.2.4/31
!
interface Ethernet2
   description P2P-LEAF22
   mtu 9214
   no switchport
   ip address 10.2.2.6/31
!
interface Ethernet4
   description P2P-BGW2
   mtu 9214
   no switchport
   ip address 10.2.2.1/31
!
interface Loopback0
   description ROUTER-ID
   ip address 10.2.0.1/32
!
interface Management0
   vrf MGMT
   ip address 172.20.20.14/24
   ipv6 address 3fff:172:20:20::e/64
!
ip routing
ip routing vrf MGMT
!
ip route vrf MGMT 0.0.0.0/0 172.20.20.1
!
peer-filter LEAFS-AS-FILTER
   10 match as-range 65002 result accept
!
router bgp 65002
   router-id 10.2.0.1
   maximum-paths 4 ecmp 4
   bgp listen range 10.2.0.0/24 peer-group LEAFS-EVPN peer-filter LEAFS-AS-FILTER
   bgp listen range 10.2.2.0/23 peer-group LEAFS-UNDERLAY peer-filter LEAFS-AS-FILTER
   neighbor LEAFS-EVPN peer group
   neighbor LEAFS-EVPN next-hop-unchanged
   neighbor LEAFS-EVPN update-source Loopback0
   neighbor LEAFS-EVPN bfd
   neighbor LEAFS-EVPN ebgp-multihop 5
   neighbor LEAFS-EVPN route-reflector-client
   neighbor LEAFS-EVPN send-community extended
   neighbor LEAFS-UNDERLAY peer group
   neighbor LEAFS-UNDERLAY remote-as 65001
   neighbor LEAFS-UNDERLAY bfd
   neighbor LEAFS-UNDERLAY route-reflector-client
   !
   address-family evpn
      neighbor LEAFS-EVPN activate
   !
   address-family ipv4
      no neighbor LEAFS-EVPN activate
      neighbor LEAFS-UNDERLAY activate
      network 10.2.0.1/32
      network 10.2.2.0/31
      network 10.2.2.4/31
      network 10.2.2.6/31
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end
