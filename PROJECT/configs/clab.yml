name: nexus-lab

topology:
  nodes:
    bgw1:
      kind: arista_ceos
      image: ceos:4.34.2F
      ports:
        - "2201:22"
    bgw2:
      kind: arista_ceos
      image: ceos:4.34.2F
      ports:
        - "2202:22"

    spine11:
      kind: arista_ceos
      image: ceos:4.34.2F
      ports:
        - "2203:22"

    spine12:
      kind: arista_ceos
      image: ceos:4.34.2F
      ports:
        - "2204:22"

    spine21:
      kind: arista_ceos
      image: ceos:4.34.2F
      ports:
        - "2205:22"

    spine22:
      kind: arista_ceos
      image: ceos:4.34.2F
      ports:
        - "2206:22"

    leaf11:
      kind: arista_ceos
      image: ceos:4.34.2F
      ports:
        - "2207:22"

    leaf12:
      kind: arista_ceos
      image: ceos:4.34.2F
      ports:
        - "2208:22"

    leaf21:
      kind: arista_ceos
      image: ceos:4.34.2F
      ports:
        - "2209:22"

    leaf22:
      kind: arista_ceos
      image: ceos:4.34.2F
      ports:
        - "2210:22"

    host1:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.10.10.1/24 dev eth1
        - ip route del default
        - ip route add default via 10.10.10.254 dev eth1

    host2:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.10.20.1/24 dev eth1
        - ip route del default
        - ip route add default via 10.10.20.254 dev eth1

    host3:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.10.10.2/24 dev eth1
        - ip route del default
        - ip route add default via 10.10.10.254 dev eth1

    host4:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.10.20.2/24 dev eth1
        - ip route del default
        - ip route add default via 10.10.20.254 dev eth1

    gw:
      kind: linux
      image: frr-nft:latest
      ports:
        - "2213:22"
      exec:
        - ip link add GW type vrf table 50000
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth1 master GW
        - ip link set eth2 master GW
        - ip addr add 10.0.2.1/31 dev eth1
        - ip addr add 10.0.2.3/31 dev eth2
        - ip link set GW up
        - ip link add lo0 type dummy
        - ip link set lo0 master GW
        - ip link set lo0 up
        - ip addr add 10.0.1.0/32 dev lo0
        - ip link add lo1 type dummy
        - ip link set lo1 master GW
        - ip link set lo1 up
        - ip addr add 8.8.8.8/32 dev lo0
      binds:
        - gw/daemons:/etc/frr/daemons
        - gw/frr.conf:/etc/frr/frr.conf
        - gw/vtysh.conf:/etc/frr/vtysh.conf
    fw1:
      kind: linux
      image: frr-nft:latest
      ports:
        - "2214:22"
      exec:
        - ip link add FW type vrf table 50000
        - ip link add link eth1 name eth1.110 type vlan id 110
        - ip link add link eth1 name eth1.120 type vlan id 120
        - ip link set eth1.110 up
        - ip link set eth1.120 up
        - ip link set eth1.110 master FW
        - ip link set eth1.120 master FW
        - ip addr add 10.1.2.13/31 dev eth1.110
        - ip addr add 10.1.2.15/31 dev eth1.120
        - ip link set FW up
        - ip link add lo0 type dummy
        - ip link set lo0 master FW
        - ip link set lo0 up
        - ip addr add 10.0.1.1/32 dev lo0
        - ip link set eth3 up
        - ip link set eth3 master FW
        - ip addr add 10.0.2.0/31 dev eth3
        - iptables -I FORWARD 1 -s 10.10.20.0/24 -d 10.10.10.0/24 -p icmp --icmp-type echo-request -j DROP
        - iptables -I FORWARD 2 -s 10.10.20.0/24 -d 8.8.8.8 -j DROP

      binds:
        - fw1/daemons:/etc/frr/daemons
        - fw1/frr.conf:/etc/frr/frr.conf
        - fw1/vtysh.conf:/etc/frr/vtysh.conf

    fw2:
      kind: linux
      image: frr-nft:latest
      ports:
        - "2215:22"
      exec:
        - ip link add FW type vrf table 50000
        - ip link add link eth1 name eth1.110 type vlan id 110
        - ip link add link eth1 name eth1.120 type vlan id 120
        - ip link set eth1.110 up
        - ip link set eth1.120 up
        - ip link set eth1.110 master FW
        - ip link set eth1.120 master FW
        - ip addr add 10.2.2.13/31 dev eth1.110
        - ip addr add 10.2.2.15/31 dev eth1.120
        - ip link set FW up
        - ip link add lo0 type dummy
        - ip link set lo0 master FW
        - ip link set lo0 up
        - ip addr add 10.0.1.2/32 dev lo0
        - ip link set eth3 up
        - ip link set eth3 master FW
        - ip addr add 10.0.2.2/31 dev eth3
        - iptables -I FORWARD 1 -s 10.10.20.0/24 -d 10.10.10.0/24 -p icmp --icmp-type echo-request -j DROP
        - iptables -I FORWARD 2 -s 10.10.20.0/24 -d 8.8.8.8 -j DROP

      binds:
        - fw2/daemons:/etc/frr/daemons
        - fw2/frr.conf:/etc/frr/frr.conf
        - fw2/vtysh.conf:/etc/frr/vtysh.conf

  links:
    - endpoints: ["bgw1:eth3","bgw2:eth3"]
    - endpoints: ["bgw1:eth1","spine11:eth4"]
    - endpoints: ["bgw1:eth2","spine12:eth4"]
    - endpoints: ["bgw2:eth1","spine21:eth4"]
    - endpoints: ["bgw2:eth2","spine22:eth4"]

    - endpoints: ["spine11:eth1","leaf11:eth1"]
    - endpoints: ["spine11:eth2","leaf12:eth1"]

    - endpoints: ["spine12:eth1","leaf11:eth2"]
    - endpoints: ["spine12:eth2","leaf12:eth2"]

    - endpoints: ["spine21:eth1","leaf21:eth1"]
    - endpoints: ["spine21:eth2","leaf22:eth1"]

    - endpoints: ["spine22:eth1","leaf21:eth2"]
    - endpoints: ["spine22:eth2","leaf22:eth2"]

    - endpoints: ["leaf12:eth3","fw1:eth1"]
    - endpoints: ["leaf22:eth3","fw2:eth1"]

    - endpoints: ["gw:eth1","fw1:eth3"]
    - endpoints: ["gw:eth2","fw2:eth3"]

    - endpoints: ["host1:eth1","leaf11:eth3"]
    - endpoints: ["host2:eth1","leaf11:eth4"]
    - endpoints: ["host3:eth1","leaf21:eth3"]
    - endpoints: ["host4:eth1","leaf21:eth4"]
