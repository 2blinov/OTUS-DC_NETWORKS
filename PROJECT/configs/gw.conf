frr version 10.7.1
frr defaults traditional
hostname gw
domainname localdomain
log syslog informational
service integrated-vtysh-config
!
vrf GW
exit-vrf
!
router bgp 65100 vrf GW
 bgp router-id 10.0.1.0
 no bgp ebgp-requires-policy
 neighbor 10.0.2.0 remote-as 65101
 neighbor 10.0.2.0 bfd
 neighbor 10.0.2.0 bfd profile P-BFD
 neighbor 10.0.2.2 remote-as 65102
 neighbor 10.0.2.2 bfd
 neighbor 10.0.2.2 bfd profile P-BFD
 !
 address-family ipv4 unicast
  network 8.8.8.8/32
  network 10.0.1.0/32
  network 10.0.2.0/31
  network 10.0.2.2/31
  neighbor 10.0.2.0 default-originate
  neighbor 10.0.2.0 soft-reconfiguration inbound
  neighbor 10.0.2.2 default-originate
  neighbor 10.0.2.2 soft-reconfiguration inbound
 exit-address-family
exit
!
bfd
 profile P-BFD
 exit
 !
exit
