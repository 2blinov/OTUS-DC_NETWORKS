! device: LEAF11 (cEOSLab, EOS-4.34.2F-43232954.4342F (engineering build))
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$zM2j3Qv.SCWQAHgS$fc..dLhgAM6jPupJkZc.GEYa3KjZtzHugW4Cxz9d2qlPNHoAXqME2DuM33LsQfi4DShpzQvVamdGoxn8UOOP91
!
management api http-commands
   no shutdown
!
alias sibs show ip bgp summary
alias srb show running-config section bgp
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname LEAF11
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 10
   name VLAN10
!
vlan 20
   name VLAN20
!
vrf instance MGMT
!
vrf instance TENANT1
!
vrf instance TENANT2
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   description P2P-SPINE11
   mtu 9214
   no switchport
   ip address 10.1.2.5/31
!
interface Ethernet2
   description P2P-SPINE22
   mtu 9214
   no switchport
   ip address 10.1.2.9/31
!
interface Ethernet3
   description HOST1
   switchport access vlan 10
!
interface Ethernet4
   description HOST2
   switchport access vlan 20
!
interface Loopback0
   description ROUTER-ID
   ip address 10.1.0.3/32
!
interface Management0
   vrf MGMT
   ip address 172.20.20.11/24
   ipv6 address 3fff:172:20:20::b/64
!
interface Vlan10
   description VLAN10
   vrf TENANT1
   ip address 10.10.10.254/24
!
interface Vlan20
   description VLAN20
   vrf TENANT2
   ip address 10.10.20.254/24
!
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 20 vni 10020
   vxlan vrf TENANT1 vni 50001
   vxlan vrf TENANT2 vni 50002
!
ip routing
ip routing vrf MGMT
ip routing vrf TENANT1
ip routing vrf TENANT2
!
ip route vrf MGMT 0.0.0.0/0 172.20.20.1
!
router bgp 65001
   router-id 10.1.0.3
   maximum-paths 4 ecmp 4
   neighbor SPINE-EVPN peer group
   neighbor SPINE-EVPN remote-as 65001
   neighbor SPINE-EVPN next-hop-unchanged
   neighbor SPINE-EVPN update-source Loopback0
   neighbor SPINE-EVPN bfd
   neighbor SPINE-EVPN ebgp-multihop 5
   neighbor SPINE-EVPN send-community extended
   neighbor SPINE-UNDERLAY peer group
   neighbor SPINE-UNDERLAY remote-as 65001
   neighbor SPINE-UNDERLAY bfd
   neighbor 10.1.0.1 peer group SPINE-EVPN
   neighbor 10.1.0.2 peer group SPINE-EVPN
   neighbor 10.1.2.4 peer group SPINE-UNDERLAY
   neighbor 10.1.2.8 peer group SPINE-UNDERLAY
   !
   vlan 10
      rd auto
      route-target both 10:10010
      redistribute learned
   !
   vlan 20
      rd auto
      route-target both 20:10020
      redistribute learned
   !
   address-family evpn
      neighbor SPINE-EVPN activate
   !
   address-family ipv4
      no neighbor SPINE-EVPN activate
      neighbor SPINE-UNDERLAY activate
      network 10.1.0.3/32
      network 10.1.2.4/31
      network 10.1.2.8/31
   !
   vrf TENANT1
      rd 10.1.0.3:1
      route-target import evpn 1:50001
      route-target export evpn 1:50001
   !
   vrf TENANT2
      rd 10.1.0.3:2
      route-target import evpn 1:50002
      route-target export evpn 1:50002
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end
