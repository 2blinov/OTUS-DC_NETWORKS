! Command: show running-config
! device: LEAF2 (cEOSLab, EOS-4.34.2F-43232954.4342F (engineering build))
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$w042lbrbzt3FDglo$gjByHrofRdF4WZoiFdCZ2.giGin1.VPANB.YCHBrXUnnJ4/WsTAhuLyiPs356YBB.uZTFO83UGWxLNTENk.Tw/
!
management api http-commands
   no shutdown
!
alias srb show running-config section bgp
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname LEAF2
dns domain lab.local
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 10
   name VLAN10
!
vlan 20
   name VLAN20
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   description P2P-SPINE1
   mtu 9214
   no switchport
   ip address 10.1.2.3/31
   bfd interval 100 min_rx 100 multiplier 3
!
interface Ethernet2
   description P2P-SPINE2
   mtu 9214
   no switchport
   ip address 10.1.2.9/31
   bfd interval 100 min_rx 100 multiplier 3
!
interface Ethernet3
   description "SRV2"
   switchport access vlan 10
!
interface Ethernet4
   description "SRV3"
   switchport access vlan 20
!
interface Loopback0
   description ROUTER-ID
   ip address 10.1.0.4/32
!
interface Management0
   ip address 172.20.20.7/24
   ipv6 address 3fff:172:20:20::7/64
!
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 20 vni 10020
!
ip routing
!
ip route 0.0.0.0/0 172.20.20.1
!
ipv6 route ::/0 3fff:172:20:20::1
!
route-map RM_REDISTRIBUTE-Lo0 permit 10
   match interface Loopback0
   set community 65002:1
   set origin igp
!
router bgp 65002
   router-id 10.1.0.4
   maximum-paths 4
   neighbor SPINE-EVPN peer group
   neighbor SPINE-EVPN remote-as 65000
   neighbor SPINE-EVPN next-hop-unchanged
   neighbor SPINE-EVPN update-source Loopback0
   neighbor SPINE-EVPN ebgp-multihop 5
   neighbor SPINE-EVPN send-community extended
   neighbor SPINE-UNDERLAY peer group
   neighbor SPINE-UNDERLAY remote-as 65000
   neighbor SPINE-UNDERLAY bfd
   neighbor 10.1.0.1 peer group SPINE-EVPN
   neighbor 10.1.0.2 peer group SPINE-EVPN
   neighbor 10.1.2.2 peer group SPINE-UNDERLAY
   neighbor 10.1.2.8 peer group SPINE-UNDERLAY
   !
   vlan 10
      rd 10.1.0.4:10010
      route-target both 10010:10010
      redistribute learned
   !
   vlan 20
      rd 10.1.0.4:10020
      route-target both 10020:10020
      redistribute learned
   !
   address-family evpn
      neighbor SPINE-EVPN activate
   !
   address-family ipv4
      no neighbor SPINE-EVPN activate
      neighbor SPINE-UNDERLAY activate
      redistribute connected route-map RM_REDISTRIBUTE-Lo0
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end
