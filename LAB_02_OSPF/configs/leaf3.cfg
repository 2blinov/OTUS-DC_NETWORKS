   mtu 9214
   no switchport
   ip address 10.1.2.5/31
   bfd interval 100 min_rx 100 multiplier 3
   ip ospf neighbor bfd
   ip ospf dead-interval 3
   ip ospf hello-interval 1
   ip ospf network point-to-point
