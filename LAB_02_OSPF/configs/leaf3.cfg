no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$QpdONVyT.j7jvUtX$BW1CO0blVKBQ2xY6IHhPJrf9HeWT6mrrXqT1n5s9O.e2LW21wic0hGgQRjhkqI/kYl2l0PD985SpFh5C8bgmP0
