name: fabric

topology:
  defaults:
    restart-policy: unless-stopped

  nodes:
    spine1:
      kind: arista_ceos
      image: ceos:4.34.2F
      ports:
        - "2201:22"

    spine2:
      kind: arista_ceos
      image: ceos:4.34.2F
      ports:
        - "2202:22"

    leaf1:
      kind: arista_ceos
      image: ceos:4.34.2F
      ports:
        - "2221:22"


    leaf2:
      kind: arista_ceos
      image: ceos:4.34.2F
      ports:
        - "2222:22"

    leaf3:
      kind: arista_ceos
      image: ceos:4.34.2F
      ports:
        - "2223:22"

    host1:
      kind: linux
      image: alpine:latest

    host2:
      kind: linux
      image: alpine:latest

    host3:
      kind: linux
      image: alpine:latest

    host4:
      kind: linux
      image: alpine:latest

  links:
    - endpoints: ["leaf1:eth1","spine1:eth1"]
    - endpoints: ["leaf1:eth2","spine2:eth1"]

    - endpoints: ["leaf2:eth1","spine1:eth2"]
    - endpoints: ["leaf2:eth2","spine2:eth2"]

    - endpoints: ["leaf3:eth1","spine1:eth3"]
    - endpoints: ["leaf3:eth2","spine2:eth3"]

    - endpoints: ["host1:eth1","leaf1:eth3"]
    - endpoints: ["host2:eth1","leaf2:eth3"]
    - endpoints: ["host3:eth1","leaf3:eth3"]
    - endpoints: ["host4:eth1","leaf3:eth4"]
