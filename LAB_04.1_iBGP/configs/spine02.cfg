! Command: show running-config
! device: SPINE2 (cEOSLab, EOS-4.34.2F-43232954.4342F (engineering build))
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$4R/NFnTS7au67JUw$8LBqpbSEDn7zeDmcIYULFIA1BJnrAbxeGhe49AOq6y5.nIAOl1GVZ8L6eyDLjc.5M4DZSrzkTq9TTmlsNhKCa/
!
management api http-commands
   no shutdown
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname SPINE2
dns domain lab.local
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   description P2P-LEAF1
   mtu 9214
   no switchport
   ip address 10.1.2.6/31
   bfd interval 100 min_rx 100 multiplier 3
!
interface Ethernet2
   description P2P-LEAF2
   mtu 9214
   no switchport
   ip address 10.1.2.8/31
   bfd interval 100 min_rx 100 multiplier 3
!
interface Ethernet3
   description P2P-LEAF3
   mtu 9214
   no switchport
   ip address 10.1.2.10/31
   bfd interval 100 min_rx 100 multiplier 3
!
interface Loopback0
   description ROUTER-ID
   ip address 10.1.0.2/32
!
interface Management0
   ip address 172.20.20.7/24
   ipv6 address 3fff:172:20:20::7/64
!
ip routing
!
ip route 0.0.0.0/0 172.20.20.1
!
ipv6 route ::/0 3fff:172:20:20::1
!
route-map RM_REDISTRIBUTE-Lo0 permit 10
   match interface Loopback0
   set origin igp
!
peer-filter LEAFS-AS-FILTER
   10 match as-range 65001 result accept
!
router bgp 65001
   router-id 10.1.0.2
   maximum-paths 4
   bgp listen range 10.1.2.0/23 peer-group LEAFS peer-filter LEAFS-AS-FILTER
   neighbor LEAFS peer group
   neighbor LEAFS remote-as 65001
   neighbor LEAFS bfd
   neighbor LEAFS route-reflector-client
   !
   address-family ipv4
      neighbor LEAFS activate
      network 10.1.2.6/31
      network 10.1.2.8/31
      network 10.1.2.10/31
      redistribute connected route-map RM_REDISTRIBUTE-Lo0
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end
