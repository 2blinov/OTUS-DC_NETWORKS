! Command: show running-config
! device: LEAF4 (vEOS-lab, EOS-4.29.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
alias srb show running-config section bgp
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname LEAF4
dns domain lab.local
!
spanning-tree mode mstp
!
vlan 10
   name VLAN10
!
vlan 20
   name VLAN20
!
vrf instance TENANT1
!
management api http-commands
   no shutdown
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   description P2P-SPINE1
   mtu 9214
   no switchport
   ip address 10.1.2.13/31
!
interface Ethernet2
   description P2P-SPINE2
   mtu 9214
   no switchport
   ip address 10.1.2.15/31
!
interface Ethernet3
   description "SRV4"
   switchport access vlan 10
!
interface Ethernet4
   description "SRV5"
   switchport access vlan 20
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Loopback0
   description ROUTER-ID
   ip address 10.1.0.6/32
!
interface Management1
!
interface Vlan10
   description VLAN10
   vrf TENANT1
   ip address 10.10.10.254/24
!
interface Vlan20
   description VLAN20
   vrf TENANT1
   ip address 20.20.20.254/24
!
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 20 vni 10020
   vxlan vrf TENANT1 vni 50001
!
ip virtual-router mac-address 00:00:22:22:33:33
!
ip routing
ip routing vrf TENANT1
!
route-map RM_REDISTRIBUTE-Lo0 permit 10
   match interface Loopback0
   set origin igp
!
router bgp 65004
   router-id 10.1.0.6
   maximum-paths 4
   neighbor SPINE-EVPN peer group
   neighbor SPINE-EVPN remote-as 65000
   neighbor SPINE-EVPN next-hop-unchanged
   neighbor SPINE-EVPN update-source Loopback0
   neighbor SPINE-EVPN bfd
   neighbor SPINE-EVPN ebgp-multihop 5
   neighbor SPINE-EVPN send-community extended
   neighbor SPINE-UNDERLAY peer group
   neighbor SPINE-UNDERLAY remote-as 65000
   neighbor SPINE-UNDERLAY bfd
   neighbor 10.1.0.1 peer group SPINE-EVPN
   neighbor 10.1.0.2 peer group SPINE-EVPN
   neighbor 10.1.2.12 peer group SPINE-UNDERLAY
   neighbor 10.1.2.14 peer group SPINE-UNDERLAY
   !
   vlan 10
      rd 10.1.0.6:10010
      route-target both 10010:10010
      redistribute learned
   !
   vlan 20
      rd 10.1.0.6:10020
      route-target both 10020:10020
      redistribute learned
   !
   address-family evpn
      neighbor SPINE-EVPN activate
   !
   address-family ipv4
      no neighbor SPINE-EVPN activate
      neighbor SPINE-UNDERLAY activate
      redistribute connected route-map RM_REDISTRIBUTE-Lo0
   !
   vrf TENANT1
      rd 10.1.0.6:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      redistribute connected
!
end
